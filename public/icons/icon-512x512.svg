<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#030B17"/>
    </linearGradient>
    <!-- Radial Ambient Light -->
    <radialGradient id="ambient512" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#00C2FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00C2FF" stop-opacity="0"/>
    </radialGradient>
    <!-- Shield Badge Gradient -->
    <linearGradient id="shieldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007EA7"/>
      <stop offset="100%" stop-color="#003459"/>
    </linearGradient>
    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0F7FF"/>
      <stop offset="100%" stop-color="#00C2FF"/>
    </linearGradient>
    <!-- Drop Shadow -->
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#00C2FF" flood-opacity="0.7"/>
    </filter>
    <filter id="badgeShadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Base App Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad512)"/>
  <!-- Ambient Light -->
  <rect width="512" height="512" rx="116" fill="url(#ambient512)"/>
  
  <!-- Outer Metallic Bezel -->
  <rect x="14" y="14" width="484" height="484" rx="102" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Central 3D Badge -->
  <rect x="106" y="106" width="300" height="300" rx="72" fill="url(#shieldGrad512)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4" filter="url(#badgeShadow512)"/>

  <!-- Lightning Bolt -->
  <path d="M282 148L182 284H262L246 364L346 228H266L282 148Z" fill="url(#boltGrad512)" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow512)"/>

  <!-- Status Indicator Dot -->
  <circle cx="372" cy="372" r="14" fill="#10B981" filter="drop-shadow(0 0 16px #10B981)"/>
</svg>
