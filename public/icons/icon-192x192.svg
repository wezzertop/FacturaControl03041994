<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#030B17"/>
    </linearGradient>
    <!-- Radial Ambient Light -->
    <radialGradient id="ambient192" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#00C2FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00C2FF" stop-opacity="0"/>
    </radialGradient>
    <!-- Shield Badge Gradient -->
    <linearGradient id="shieldGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007EA7"/>
      <stop offset="100%" stop-color="#003459"/>
    </linearGradient>
    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0F7FF"/>
      <stop offset="100%" stop-color="#00C2FF"/>
    </linearGradient>
    <!-- Drop Shadow -->
    <filter id="glow192" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#00C2FF" flood-opacity="0.6"/>
    </filter>
    <filter id="badgeShadow192" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base App Background -->
  <rect width="192" height="192" rx="44" fill="url(#bgGrad192)"/>
  <!-- Ambient Light -->
  <rect width="192" height="192" rx="44" fill="url(#ambient192)"/>
  
  <!-- Outer Metallic Bezel -->
  <rect x="5" y="5" width="182" height="182" rx="39" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Central 3D Badge -->
  <rect x="42" y="42" width="108" height="108" rx="26" fill="url(#shieldGrad192)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" filter="url(#badgeShadow192)"/>

  <!-- Lightning Bolt -->
  <path d="M104 56L68 106H98L92 136L128 86H98L104 56Z" fill="url(#boltGrad192)" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round" filter="url(#glow192)"/>

  <!-- Status Indicator Dot -->
  <circle cx="140" cy="140" r="5" fill="#10B981" filter="drop-shadow(0 0 6px #10B981)"/>
</svg>
